<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Loading</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; }
  .loading-screen {
    width:100vw; height:100vh;
    background:linear-gradient(to bottom, var(--color-loading-top) 0%, var(--color-loading-bottom) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .loading-bar-track {
    width:300px; height:6px; background:rgba(255,255,255,0.2); border-radius:var(--radius-pill);
    margin-top:var(--space-8); overflow:hidden;
  }
  .loading-bar-fill {
    height:100%; background:#fff; border-radius:var(--radius-pill);
    animation:load-progress 3s ease-in-out infinite;
  }
  @keyframes load-progress { 0%{width:0} 100%{width:100%} }
  .loading-text {
    font-family:var(--font-label); font-weight:500; font-size:var(--text-body-sm);
    color:rgba(255,255,255,0.7); margin-top:var(--space-3);
  }
  .loading-percent {
    font-family:var(--font-mono); font-size:var(--text-h3);
    color:#fff; text-shadow:var(--text-shadow-overlay); margin-top:var(--space-4);
  }
</style>
</head>
<body>
<div class="loading-screen">
  <div class="cube-loader" style="margin:0 auto;">
    <div class="cube-inner">
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.7);transform:translateZ(3em);"></div>
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.5);transform:rotateY(180deg) translateZ(3em);"></div>
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.6);transform:rotateY(90deg) translateZ(3em);"></div>
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.6);transform:rotateY(-90deg) translateZ(3em);"></div>
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.8);transform:rotateX(90deg) translateZ(3em);"></div>
      <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.4);transform:rotateX(-90deg) translateZ(3em);"></div>
    </div>
  </div>

  <div class="loading-percent" id="percent">0%</div>
  <div class="loading-bar-track">
    <div class="loading-bar-fill" id="bar"></div>
  </div>
  <p class="loading-text">Loading world assets...</p>
</div>

<script>
let pct = 0;
const el = document.getElementById('percent');
const bar = document.getElementById('bar');
const interval = setInterval(() => {
  pct += Math.random() * 3;
  if (pct >= 100) { pct = 100; clearInterval(interval); }
  el.textContent = Math.floor(pct) + '%';
  bar.style.width = pct + '%';
  bar.style.animation = 'none';
}, 100);
</script>
</body>
</html>
