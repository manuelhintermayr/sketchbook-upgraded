<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Pause Menu</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; }
  .pause-bg {
    width:100vw; height:100vh; position:relative;
    background:linear-gradient(to bottom, #87ceeb 0%, #90c695 55%, #5a7a3a 100%);
  }
  .pause-overlay {
    position:absolute; inset:0;
    background:rgba(0,0,0,0.65); backdrop-filter:blur(4px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .pause-title { font-family:var(--font-headline); font-weight:800; font-size:var(--text-h1); color:#fff; text-shadow:var(--text-shadow-overlay); margin-bottom:var(--space-8); }
  .pause-menu { display:flex; flex-direction:column; gap:var(--space-3); min-width:280px; }
  .pause-btn {
    display:flex; align-items:center; gap:var(--space-3);
    padding:var(--space-4) var(--space-6);
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:var(--radius-lg); color:#fff;
    font-family:var(--font-body); font-size:var(--text-body); font-weight:700;
    cursor:pointer; transition:all var(--motion-fast); text-decoration:none;
  }
  .pause-btn:hover { background:rgba(255,255,255,0.2); border-color:var(--color-primary); }
  .pause-hint {
    font-family:var(--font-label); font-size:var(--text-caption);
    color:rgba(255,255,255,0.5); margin-top:var(--space-8);
  }
</style>
</head>
<body>
<div class="pause-bg">
  <div class="pause-overlay">
    <h1 class="pause-title">PAUSED</h1>
    <div class="pause-menu">
      <a href="#" class="pause-btn"><span class="material-symbols-outlined">play_arrow</span> Resume</a>
      <a href="#" class="pause-btn"><span class="material-symbols-outlined">settings</span> Settings</a>
      <a href="#" class="pause-btn"><span class="material-symbols-outlined">backpack</span> Inventory</a>
      <a href="#" class="pause-btn"><span class="material-symbols-outlined">map</span> Map</a>
      <a href="#" class="pause-btn"><span class="material-symbols-outlined">save</span> Save Game</a>
      <a href="#" class="pause-btn" style="border-color:var(--color-error);"><span class="material-symbols-outlined" style="color:var(--color-error);">logout</span> Quit to Menu</a>
    </div>
    <p class="pause-hint">Press <span class="keycap">Esc</span> to resume</p>
  </div>
</div>
</body>
</html>
