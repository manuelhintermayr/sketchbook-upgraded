<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — SketchPad</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { background:var(--color-background); display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .phone-frame {
    width:320px; background:var(--color-secondary); border-radius:24px;
    padding:var(--space-3); box-shadow:var(--shadow-lg);
  }
  .phone-screen {
    background:var(--color-surface); border-radius:18px; overflow:hidden;
  }
  .phone-header {
    background:var(--color-primary); color:var(--color-on-primary);
    padding:var(--space-4); text-align:center;
  }
  .phone-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-1); padding:var(--space-4); }
  .phone-app {
    text-align:center; padding:var(--space-3); border-radius:var(--radius-lg);
    cursor:pointer; transition:background var(--motion-fast);
  }
  .phone-app:hover { background:var(--color-surface-container); }
  .phone-app-icon {
    width:44px; height:44px; border-radius:var(--radius-lg); margin:0 auto var(--space-1);
    display:flex; align-items:center; justify-content:center;
  }
  .phone-app-name { font-family:var(--font-label); font-size:9px; font-weight:600; color:var(--color-on-surface-variant); }
  .phone-bottom { padding:var(--space-3); text-align:center; }
  .phone-home {
    width:40px; height:5px; background:var(--color-outline); border-radius:var(--radius-pill);
    margin:0 auto;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <div class="phone-header">
      <h3 style="font-family:var(--font-headline);font-size:var(--text-body);font-weight:700;">SketchPad</h3>
      <p style="font-family:var(--font-label);font-size:var(--text-caption);opacity:0.8;" id="phone-time"></p>
    </div>
    <div class="phone-grid">
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-primary);"><span class="material-symbols-outlined" style="color:var(--color-on-primary);font-size:22px;">photo_camera</span></div>
        <div class="phone-app-name">Camera</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-tertiary);"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">map</span></div>
        <div class="phone-app-name">Map</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-success);"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">directions_car</span></div>
        <div class="phone-app-name">Vehicles</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-error);"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">construction</span></div>
        <div class="phone-app-name">Build Kit</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-secondary);"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">style</span></div>
        <div class="phone-app-name">Skins</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:#9c27b0;"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">group</span></div>
        <div class="phone-app-name">Profile</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:#ff9800;"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">workspace_premium</span></div>
        <div class="phone-app-name">XP</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:#607d8b;"><span class="material-symbols-outlined" style="color:#fff;font-size:22px;">emoji_events</span></div>
        <div class="phone-app-name">Achievements</div>
      </div>
      <div class="phone-app">
        <div class="phone-app-icon" style="background:var(--color-surface-container-high);"><span class="material-symbols-outlined" style="color:var(--color-on-surface-variant);font-size:22px;">settings</span></div>
        <div class="phone-app-name">Settings</div>
      </div>
    </div>
    <div class="phone-bottom"><div class="phone-home"></div></div>
  </div>
</div>

<script>
function updateTime() {
  const now = new Date();
  document.getElementById('phone-time').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
updateTime();
setInterval(updateTime, 1000);
</script>
</body>
</html>
