<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Map</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { background:var(--color-background); }
  .map-container { max-width:800px; margin:0 auto; padding:var(--space-8); }
  .map-area {
    width:100%; aspect-ratio:16/10; background:linear-gradient(135deg, #90c695 0%, #7ab87e 30%, #5a9a5e 60%, #3d7a40 100%);
    border-radius:var(--radius-lg); position:relative; overflow:hidden; box-shadow:var(--shadow-lg);
  }
  .map-marker {
    position:absolute; width:12px; height:12px; border-radius:50%;
    border:2px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.3); cursor:pointer;
  }
  .map-marker:hover { transform:scale(1.3); }
  .map-player { background:var(--color-primary); width:16px; height:16px; animation:map-pulse 1.5s ease-in-out infinite; }
  @keyframes map-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,185,0,0.4)} 50%{box-shadow:0 0 0 8px rgba(255,185,0,0)} }
  .map-label {
    position:absolute; font-family:var(--font-label); font-size:10px; font-weight:600;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .map-legend { margin-top:var(--space-4); display:flex; gap:var(--space-4); flex-wrap:wrap; }
  .map-legend-item { display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-caption); font-family:var(--font-label); }
</style>
</head>
<body>
<div class="map-container">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4);">
    <h1 style="font-family:var(--font-headline);font-size:var(--text-h2);">World Map</h1>
    <div style="display:flex;gap:var(--space-2);">
      <button class="btn" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);">
        <span class="material-symbols-outlined" style="font-size:16px;">zoom_in</span>
      </button>
      <button class="btn" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);">
        <span class="material-symbols-outlined" style="font-size:16px;">zoom_out</span>
      </button>
    </div>
  </div>

  <div class="map-area">
    <!-- Water areas -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:20%;background:linear-gradient(to top, #568db5, rgba(86,141,181,0.3));"></div>
    <div style="position:absolute;top:10%;left:60%;width:15%;height:12%;background:rgba(86,141,181,0.6);border-radius:50%;"></div>

    <!-- Paths -->
    <div style="position:absolute;top:30%;left:20%;width:60%;height:3px;background:rgba(180,160,120,0.6);transform:rotate(-5deg);"></div>

    <!-- Markers -->
    <div class="map-marker map-player" style="top:45%;left:35%;"></div>
    <div class="map-marker" style="background:var(--color-error);top:25%;left:55%;"></div>
    <div class="map-marker" style="background:var(--color-tertiary);top:60%;left:70%;"></div>
    <div class="map-marker" style="background:var(--color-success);top:35%;left:15%;"></div>

    <!-- Labels -->
    <div class="map-label" style="top:20%;left:50%;">Spawn Point</div>
    <div class="map-label" style="top:55%;left:65%;">Coastline</div>
    <div class="map-label" style="top:30%;left:10%;">Forest</div>
    <div class="map-label" style="top:42%;left:32%;">You</div>
  </div>

  <div class="map-legend">
    <div class="map-legend-item"><div style="width:12px;height:12px;border-radius:50%;background:var(--color-primary);"></div> Player</div>
    <div class="map-legend-item"><div style="width:12px;height:12px;border-radius:50%;background:var(--color-error);"></div> Spawn Point</div>
    <div class="map-legend-item"><div style="width:12px;height:12px;border-radius:50%;background:var(--color-tertiary);"></div> Landmark</div>
    <div class="map-legend-item"><div style="width:12px;height:12px;border-radius:50%;background:var(--color-success);"></div> Resource</div>
  </div>
</div>
</body>
</html>
