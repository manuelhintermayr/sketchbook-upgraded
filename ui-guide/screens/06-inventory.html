<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Inventory</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { background:var(--color-background); }
  .inv-container { max-width:700px; margin:0 auto; padding:var(--space-8); }
  .inv-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:var(--space-3); margin-top:var(--space-4); }
  .inv-slot {
    aspect-ratio:1; background:var(--color-surface-container); border:1px solid var(--color-outline);
    border-radius:var(--radius-md); display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; transition:all var(--motion-fast); position:relative;
  }
  .inv-slot:hover { border-color:var(--color-primary); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .inv-slot.empty { background:var(--color-surface-container-high); border-style:dashed; cursor:default; }
  .inv-slot.empty:hover { transform:none; box-shadow:none; }
  .inv-count { position:absolute; bottom:4px; right:6px; font-family:var(--font-mono); font-size:10px; font-weight:700; }
  .inv-name { font-family:var(--font-label); font-size:9px; font-weight:500; color:var(--color-on-surface-variant); margin-top:2px; }
  .inv-selected { border-color:var(--color-primary); border-width:2px; background:var(--color-primary-container); }
  .inv-detail { margin-top:var(--space-6); }
</style>
</head>
<body>
<div class="inv-container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1 style="font-family:var(--font-headline);font-size:var(--text-h2);">Inventory</h1>
    <span style="font-family:var(--font-label);font-size:var(--text-body-sm);color:var(--color-on-surface-variant);">8/20 items</span>
  </div>

  <div class="inv-grid">
    <div class="inv-slot inv-selected"><span class="material-symbols-outlined" style="color:var(--color-primary);">park</span><span class="inv-name">Wood</span><span class="inv-count">x12</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:#888;">diamond</span><span class="inv-name">Iron</span><span class="inv-count">x5</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:var(--color-success);">psychiatry</span><span class="inv-name">Herb</span><span class="inv-count">x3</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:var(--color-tertiary);">phishing</span><span class="inv-name">Fish Rod</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:#a0522d;">carpenter</span><span class="inv-name">Axe</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:#e0a000;">lunch_dining</span><span class="inv-name">Apple</span><span class="inv-count">x7</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:#666;">inventory_2</span><span class="inv-name">Stone</span><span class="inv-count">x20</span></div>
    <div class="inv-slot"><span class="material-symbols-outlined" style="color:var(--color-error);">local_fire_department</span><span class="inv-name">Torch</span></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
    <div class="inv-slot empty"></div>
  </div>

  <div class="inv-detail card" style="margin-top:var(--space-6);">
    <div style="display:flex;align-items:center;gap:var(--space-3);">
      <span class="material-symbols-outlined" style="font-size:32px;color:var(--color-primary);">park</span>
      <div>
        <h4>Wood</h4>
        <p style="font-size:var(--text-body-sm);color:var(--color-on-surface-variant);">Basic building material. Can be used for crafting furniture and tools.</p>
      </div>
    </div>
    <div style="display:flex;gap:var(--space-4);margin-top:var(--space-4);">
      <span class="tag">Material</span>
      <span class="tag" style="background:var(--color-primary);color:var(--color-on-primary);">60 Credits</span>
    </div>
  </div>
</div>
</body>
</html>
