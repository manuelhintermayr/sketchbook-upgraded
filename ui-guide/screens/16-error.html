<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Error</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { background:var(--color-background); display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .error-card {
    max-width:480px; width:90%; text-align:center; padding:var(--space-10) var(--space-8);
  }
  .error-icon { font-size:64px; color:var(--color-error); margin-bottom:var(--space-4); }
  .error-code {
    font-family:var(--font-mono); font-size:var(--text-h1); font-weight:700;
    color:var(--color-error); margin-bottom:var(--space-2);
  }
  .error-title { font-family:var(--font-headline); font-size:var(--text-h3); margin-bottom:var(--space-4); }
  .error-desc { font-size:var(--text-body-sm); color:var(--color-on-surface-variant); line-height:var(--leading-relaxed); margin-bottom:var(--space-6); }
  .error-stack {
    text-align:left; font-family:var(--font-mono); font-size:var(--text-caption);
    background:var(--color-surface-container); padding:var(--space-4);
    border-radius:var(--radius-md); color:var(--color-error); margin-bottom:var(--space-6);
    overflow-x:auto; white-space:pre; line-height:1.6;
  }
</style>
</head>
<body>
<div class="error-card card">
  <div class="error-icon"><span class="material-symbols-outlined" style="font-size:inherit;">error</span></div>
  <div class="error-code">500</div>
  <h2 class="error-title">Something went wrong</h2>
  <p class="error-desc">The game engine encountered an unexpected error while loading the world. Please try again or report this issue.</p>

  <div class="error-stack">Error: Failed to load chunk 'world_terrain'
  at WorldLoader.init (engine.js:142)
  at GameManager.start (game.js:58)
  at main (index.js:12)</div>

  <div style="display:flex;gap:var(--space-3);justify-content:center;">
    <button class="btn-gold" onclick="location.reload()">Try Again</button>
    <button class="btn btn-outline">Report Bug</button>
  </div>
</div>
</body>
</html>
