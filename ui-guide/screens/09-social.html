<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Social</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { background:var(--color-background); }
  .social-container { max-width:640px; margin:0 auto; padding:var(--space-8); }
  .player-card {
    display:flex; align-items:center; gap:var(--space-4); padding:var(--space-4);
    background:var(--color-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
    margin-bottom:var(--space-3);
  }
  .player-avatar {
    width:48px; height:48px; border-radius:var(--radius-full);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-label); font-weight:700; color:#fff; flex-shrink:0;
  }
  .player-status { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:var(--space-1); }
</style>
</head>
<body>
<div class="social-container">
  <h1 style="font-family:var(--font-headline);font-size:var(--text-h2);margin-bottom:var(--space-2);">Friends</h1>
  <p style="color:var(--color-on-surface-variant);font-size:var(--text-body-sm);margin-bottom:var(--space-6);">3 online · 2 offline</p>

  <div class="player-card">
    <div class="player-avatar" style="background:var(--color-primary);">J5</div>
    <div style="flex:1;">
      <h4 style="font-size:var(--text-body);">swift502</h4>
      <p style="font-size:var(--text-caption);color:var(--color-on-surface-variant);"><span class="player-status" style="background:var(--color-success);"></span>Online · Flying over Sandbox World</p>
    </div>
    <button class="btn btn-outline" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);">Visit</button>
  </div>

  <div class="player-card">
    <div class="player-avatar" style="background:var(--color-tertiary);">RJ</div>
    <div style="flex:1;">
      <h4 style="font-size:var(--text-body);">Rider_J</h4>
      <p style="font-size:var(--text-caption);color:var(--color-on-surface-variant);"><span class="player-status" style="background:var(--color-success);"></span>Online · Driving on Test Scene 2</p>
    </div>
    <button class="btn btn-outline" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);">Visit</button>
  </div>

  <div class="player-card">
    <div class="player-avatar" style="background:var(--color-secondary);">NP</div>
    <div style="flex:1;">
      <h4 style="font-size:var(--text-body);">NightPilot</h4>
      <p style="font-size:var(--text-caption);color:var(--color-on-surface-variant);"><span class="player-status" style="background:var(--color-success);"></span>Online · Helicopter at Spawn Zone</p>
    </div>
    <button class="btn btn-outline" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);">Visit</button>
  </div>

  <div class="player-card" style="opacity:0.6;">
    <div class="player-avatar" style="background:#888;">PX</div>
    <div style="flex:1;">
      <h4 style="font-size:var(--text-body);">PhysX_fan</h4>
      <p style="font-size:var(--text-caption);color:var(--color-on-surface-variant);"><span class="player-status" style="background:var(--color-outline);"></span>Offline · Last seen 2h ago</p>
    </div>
    <button class="btn" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);" disabled>Offline</button>
  </div>

  <div class="player-card" style="opacity:0.6;">
    <div class="player-avatar" style="background:#888;">BL</div>
    <div style="flex:1;">
      <h4 style="font-size:var(--text-body);">Bolt_Runner</h4>
      <p style="font-size:var(--text-caption);color:var(--color-on-surface-variant);"><span class="player-status" style="background:var(--color-outline);"></span>Offline · Last seen 1d ago</p>
    </div>
    <button class="btn" style="padding:var(--space-1) var(--space-3);font-size:var(--text-caption);" disabled>Offline</button>
  </div>
</div>
</body>
</html>
