<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Title Screen</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; }
  .title-screen {
    width:100vw; height:100vh;
    background:linear-gradient(to bottom, var(--color-loading-top) 0%, var(--color-loading-bottom) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  .title-text {
    font-family:var(--font-headline); font-weight:800; font-size:4rem;
    color:#fff; text-shadow:var(--text-shadow-overlay);
    margin-bottom:var(--space-2); user-select:none;
  }
  .title-version {
    font-family:var(--font-label); font-weight:500; font-size:var(--text-body);
    color:rgba(255,255,255,0.7); margin-bottom:var(--space-8);
  }
  .title-prompt {
    font-family:var(--font-body); font-size:var(--text-body-sm);
    color:rgba(255,255,255,0.6);
    animation:pulse 2s ease-in-out infinite;
    margin-top:var(--space-8);
  }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .cube-bounce { animation:bounce 2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="title-screen">
  <div class="title-text">Sketchbook</div>
  <div class="title-version">Version 0.4</div>

  <div class="cube-bounce">
    <div class="cube-loader" style="margin:0 auto;">
      <div class="cube-inner">
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.7);transform:translateZ(3em);"></div>
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.5);transform:rotateY(180deg) translateZ(3em);"></div>
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.6);transform:rotateY(90deg) translateZ(3em);"></div>
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.6);transform:rotateY(-90deg) translateZ(3em);"></div>
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.8);transform:rotateX(90deg) translateZ(3em);"></div>
        <div style="position:absolute;width:6em;height:6em;background:rgba(255,185,0,0.4);transform:rotateX(-90deg) translateZ(3em);"></div>
      </div>
    </div>
  </div>

  <p class="text-overlay title-prompt">Loading...</p>
</div>
</body>
</html>
