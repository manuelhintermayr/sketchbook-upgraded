<!DOCTYPE html>
<html lang="de" data-theme="sketchbook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Photo Mode</title>
<link rel="stylesheet" href="../sketchbook.css">
<link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&family=Catamaran:wght@100;200;300;400;500;600;700;800;900&family=Cutive+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { margin:0; overflow:hidden; }
  .photo-scene {
    width:100vw; height:100vh; position:relative;
    background:linear-gradient(to bottom, #ffa07a 0%, #ff7043 20%, #87ceeb 40%, #90c695 65%, #5a7a3a 100%);
  }
  .photo-frame {
    position:absolute; inset:40px;
    border:2px solid rgba(255,255,255,0.4); border-radius:var(--radius-md);
  }
  .photo-crosshair {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:24px; height:24px;
  }
  .photo-crosshair::before, .photo-crosshair::after {
    content:""; position:absolute; background:rgba(255,255,255,0.6);
  }
  .photo-crosshair::before { width:1px; height:100%; left:50%; }
  .photo-crosshair::after { width:100%; height:1px; top:50%; }
  .photo-controls {
    position:fixed; bottom:var(--space-6); left:50%; transform:translateX(-50%);
    display:flex; gap:var(--space-3); align-items:center;
  }
  .photo-btn {
    width:56px; height:56px; border-radius:var(--radius-full);
    background:rgba(255,255,255,0.2); backdrop-filter:blur(4px);
    border:2px solid rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all var(--motion-fast);
  }
  .photo-btn:hover { background:rgba(255,255,255,0.3); }
  .photo-btn-main { width:64px; height:64px; background:var(--color-primary); border-color:var(--color-primary); }
  .photo-settings {
    position:fixed; right:var(--space-4); top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; gap:var(--space-3);
  }
  .photo-slider-label { font-family:var(--font-label); font-size:10px; color:rgba(255,255,255,0.7); text-align:center; }
</style>
</head>
<body>
<div class="photo-scene">
  <div class="photo-frame"></div>
  <div class="photo-crosshair"></div>

  <!-- Top info -->
  <div style="position:fixed;top:var(--space-4);left:50%;transform:translateX(-50%);">
    <span class="text-overlay" style="font-family:var(--font-label);font-size:var(--text-caption);letter-spacing:0.1em;">PHOTO MODE</span>
  </div>

  <!-- Controls bottom -->
  <div class="photo-controls">
    <div class="photo-btn"><span class="material-symbols-outlined" style="color:#fff;">filter</span></div>
    <div class="photo-btn"><span class="material-symbols-outlined" style="color:#fff;">tune</span></div>
    <div class="photo-btn photo-btn-main"><span class="material-symbols-outlined" style="color:var(--color-on-primary);font-size:28px;">photo_camera</span></div>
    <div class="photo-btn"><span class="material-symbols-outlined" style="color:#fff;">zoom_in</span></div>
    <div class="photo-btn"><span class="material-symbols-outlined" style="color:#fff;">grid_on</span></div>
  </div>

  <!-- Right sliders -->
  <div class="photo-settings">
    <div>
      <div class="photo-slider-label">Focus</div>
      <input type="range" min="0" max="100" value="50" style="width:80px;accent-color:var(--color-primary);writing-mode:vertical-lr;direction:rtl;height:80px;">
    </div>
    <div>
      <div class="photo-slider-label">Zoom</div>
      <input type="range" min="0" max="100" value="30" style="width:80px;accent-color:var(--color-primary);writing-mode:vertical-lr;direction:rtl;height:80px;">
    </div>
  </div>

  <!-- Hint -->
  <div style="position:fixed;bottom:var(--space-3);left:var(--space-4);">
    <span class="text-overlay" style="font-size:var(--text-caption);">Press <span class="keycap" style="font-size:10px;">Esc</span> to exit</span>
  </div>
</div>
</body>
</html>
